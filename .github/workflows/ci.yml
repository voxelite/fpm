name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  # Only the tests: the benchmark and accuracy tools download other libraries (see the job "tools")
  CMAKE_OPTIONS: -DFPM_BUILD_BENCHMARK=OFF -DFPM_BUILD_ACCURACY=OFF

# Every platform is built with the options of the library (`library` below): the ones for the results that a type cannot
# represent, FPM_DEFINED_OVERFLOW and (where there are assertions, so not for the Release builds) FPM_CHECK_OVERFLOW, and
# FPM_NO_FLOATING_WIDENING wherever the tests run (for std::float16_t, which the compilers may add).

jobs:
  # GCC and Clang
  linux:
    name: Linux, ${{ matrix.cxx }}, ${{ matrix.build }} ${{ matrix.library }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-14, clang++-18]
        build: [Debug, Release]
        library:
          - ""
          - -DFPM_DEFINED_OVERFLOW=ON
          - -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_NO_FLOATING_WIDENING=ON
        exclude:
          - build: Release
            library: -DFPM_CHECK_OVERFLOW=ON
          - build: Release
            library: -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          ${{ env.CMAKE_OPTIONS }} ${{ matrix.library }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build

  # The variations of the library and of the compilers
  linux-variants:
    name: Linux, ${{ matrix.variant }} ${{ matrix.library }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant:
          - Clang 18 with sanitizers
          - Clang 18 with sanitizers and FPM_CHECK_OVERFLOW
          - Clang 18 with libc++
          - Clang 18 with FPM_FRACTION_STRICT
          - Clang 18 without 128-bit integers
          - GCC 14 without 128-bit integers
          - GCC 14 for 32 bits (x86)
        library:
          - ""
          - -DFPM_DEFINED_OVERFLOW=ON
        include:
          - variant: Clang 18 with sanitizers
            cxx: clang++-18
            build: Debug
            flags: -fsanitize=undefined,address -fno-sanitize-recover=undefined
          - variant: Clang 18 with sanitizers and FPM_CHECK_OVERFLOW
            cxx: clang++-18
            build: Debug
            flags: -fsanitize=undefined,address -fno-sanitize-recover=undefined
            options: -DFPM_CHECK_OVERFLOW=ON
          - variant: Clang 18 with libc++
            cxx: clang++-18
            build: Release
            flags: -stdlib=libc++
            packages: libc++-18-dev libc++abi-18-dev
          - variant: Clang 18 with FPM_FRACTION_STRICT
            cxx: clang++-18
            build: Debug
            options: -DFPM_FRACTION_STRICT=ON
          - variant: Clang 18 without 128-bit integers
            cxx: clang++-18
            build: Release
            flags: -DFPM_NO_INT128
          - variant: GCC 14 without 128-bit integers
            cxx: g++-14
            build: Release
            flags: -DFPM_NO_INT128
          # (With SSE2 for the floating-point numbers of the tests: not the extended precision of x87)
          - variant: GCC 14 for 32 bits (x86)
            cxx: g++-14
            build: Release
            flags: -m32 -msse2 -mfpmath=sse
            packages: g++-14-multilib
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
          ${{ env.CMAKE_OPTIONS }} ${{ matrix.options }} ${{ matrix.library }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build

  # Every header on its own, and a program that uses all of the library (so the templates are compiled as well):
  # with every combination of the options of the library, with and without assertions
  linux-headers:
    name: Linux, headers, ${{ matrix.name }} ${{ matrix.library }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name:
          - GCC 14, warnings
          - Clang 18, warnings
          - GCC 14, without exceptions
          - Clang 18, without exceptions
        library:
          - ""
          - -DFPM_DEFINED_OVERFLOW
          - -DFPM_CHECK_OVERFLOW
          - -DFPM_DEFINED_OVERFLOW -DFPM_CHECK_OVERFLOW
        include:
          - name: GCC 14, warnings
            cxx: g++-14
            flags: -Wall -Wextra -Werror
          - name: Clang 18, warnings
            cxx: clang++-18
            flags: -Wall -Wextra -Werror
          - name: GCC 14, without exceptions
            cxx: g++-14
            flags: -fno-exceptions -fno-rtti
          - name: Clang 18, without exceptions
            cxx: clang++-18
            flags: -fno-exceptions -fno-rtti
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          for options in "" "-DFPM_FRACTION_STRICT" "-DFPM_NO_INT128" "-DFPM_FRACTION_STRICT -DFPM_NO_INT128"; do
            for assertions in "" "-DNDEBUG"; do
              echo "=== $options $assertions"
              for header in $(cd include && find fpm -name '*.hpp' | sort); do
                echo "#include <$header>" | ${{ matrix.cxx }} -std=c++26 ${{ matrix.flags }} ${{ matrix.library }} $options $assertions -Iinclude -fsyntax-only -x c++ -
              done
              ${{ matrix.cxx }} -std=c++26 ${{ matrix.flags }} ${{ matrix.library }} $options $assertions -Iinclude -fsyntax-only tests/esp-idf/main/main.cpp
            done
          done

  # Other architectures. ARM64 has a `long double` with 113 bits of precision.
  linux-arm64:
    name: Linux ARM64, ${{ matrix.cxx }}, ${{ matrix.build }} ${{ matrix.library }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-14, clang++-18]
        build: [Debug, Release]
        library:
          - ""
          - -DFPM_DEFINED_OVERFLOW=ON
          - -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_NO_FLOATING_WIDENING=ON
        exclude:
          - build: Release
            library: -DFPM_CHECK_OVERFLOW=ON
          - build: Release
            library: -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          ${{ env.CMAKE_OPTIONS }} ${{ matrix.library }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build

  # With an emulator
  linux-emulated:
    name: Linux ${{ matrix.name }} (emulated) ${{ matrix.library }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [RISC-V 64, ARM 32]
        library:
          - ""
          - -DFPM_DEFINED_OVERFLOW=ON
          - -DFPM_NO_FLOATING_WIDENING=ON
        include:
          - name: RISC-V 64
            processor: riscv64
            triple: riscv64-linux-gnu
            emulator: qemu-riscv64
          - name: ARM 32
            processor: arm
            triple: arm-linux-gnueabihf
            emulator: qemu-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y g++-14-${{ matrix.triple }} qemu-user
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.processor }}
          -DCMAKE_CXX_COMPILER=${{ matrix.triple }}-g++-14
          "-DCMAKE_CROSSCOMPILING_EMULATOR=${{ matrix.emulator }};-L;/usr/${{ matrix.triple }}"
          ${{ env.CMAKE_OPTIONS }} ${{ matrix.library }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build

  windows:
    name: Windows, ${{ matrix.name }}, ${{ matrix.build }} ${{ matrix.library }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: ["MSVC", "MSVC, 32 bits (x86)", "clang-cl"]
        build: [Release, Debug]
        library:
          - ""
          - -DFPM_DEFINED_OVERFLOW=ON
          - -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_NO_FLOATING_WIDENING=ON
        exclude:
          - build: Release
            library: -DFPM_CHECK_OVERFLOW=ON
          - build: Release
            library: -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
        include:
          - name: MSVC
            arguments: -A x64
          - name: MSVC, 32 bits (x86)
            arguments: -A Win32
          - name: clang-cl
            arguments: -A x64 -T ClangCL
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build ${{ matrix.arguments }} ${{ env.CMAKE_OPTIONS }} ${{ matrix.library }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build }}

  windows-mingw:
    name: Windows, MinGW ${{ matrix.name }}, ${{ matrix.build }} ${{ matrix.library }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: [GCC, Clang]
        build: [Debug, Release]
        library:
          - ""
          - -DFPM_DEFINED_OVERFLOW=ON
          - -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_NO_FLOATING_WIDENING=ON
        exclude:
          - build: Release
            library: -DFPM_CHECK_OVERFLOW=ON
          - build: Release
            library: -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
        include:
          - name: GCC
            system: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            compiler: gcc
            cxx: g++
          - name: Clang
            system: CLANG64
            prefix: mingw-w64-clang-x86_64
            compiler: clang
            cxx: clang++
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.system }}
          update: true
          install: >-
            ${{ matrix.prefix }}-${{ matrix.compiler }}
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          ${{ env.CMAKE_OPTIONS }} ${{ matrix.library }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build

  # WebAssembly (32 bits), with Node.js to run the tests
  emscripten:
    name: Emscripten, ${{ matrix.build }} ${{ matrix.library }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
        library:
          - ""
          - -DFPM_DEFINED_OVERFLOW=ON
          - -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_NO_FLOATING_WIDENING=ON
        exclude:
          - build: Release
            library: -DFPM_CHECK_OVERFLOW=ON
          - build: Release
            library: -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      # (The tests check the exceptions of std::format, which Emscripten disables by default)
      - name: Configure
        run: >
          emcmake cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DCMAKE_CXX_FLAGS=-fexceptions
          -DCMAKE_EXE_LINKER_FLAGS=-fexceptions
          ${{ env.CMAKE_OPTIONS }} ${{ matrix.library }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build

  # Compiled only: the program of tests/esp-idf uses all of the library
  esp-idf:
    name: ESP-IDF, ${{ matrix.target }} ${{ matrix.library }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Xtensa and RISC-V, both with 32 bits
        target: [esp32, esp32c3]
        library:
          - ""
          - -DFPM_DEFINED_OVERFLOW=ON
          - -DFPM_CHECK_OVERFLOW=ON
          - -DFPM_DEFINED_OVERFLOW=ON -DFPM_CHECK_OVERFLOW=ON
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          path: tests/esp-idf
          command: idf.py ${{ matrix.library }} build

  # The benchmark and accuracy tools, which download the libraries they compare with
  tools:
    name: Benchmark and accuracy tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_C_COMPILER=clang-18 -DFPM_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Accuracy
        run: cd build && ./fpm-accuracy && ls *.csv
      - name: Benchmark
        run: >
          cd build
          && ./fpm-benchmark --benchmark_min_time=0.01 --benchmark_out=performance.json --benchmark_out_format=json
          && python3 ../benchmarks/benchmark.py performance.json performance.csv
