# The basic builds. The CI for all the platforms is .github/workflows/ci.yml.
version: 0.1.{build}

branches:
  only:
    - master

# With the compiler for C++26
image:
- Visual Studio 2022

configuration:
  - Debug
  - Release

# Only the tests: the benchmark and accuracy tools download other libraries
before_build:
  - cmake -B build -DFPM_BUILD_BENCHMARK=OFF -DFPM_BUILD_ACCURACY=OFF

build:
  project: build/ALL_BUILD.vcxproj
  parallel: true
  verbosity: minimal

test_script:
  - ctest --test-dir build -C %configuration% --output-on-failure
